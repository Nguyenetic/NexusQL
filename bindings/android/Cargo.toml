[package]
name = "nexusql-android"
version = "0.1.0"
edition = "2021"

[lib]
name = "nexusql_android"
crate-type = ["cdylib"]

[dependencies]
jni = { version = "0.21", default-features = false }
rusqlite = { version = "0.31", features = ["bundled"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
