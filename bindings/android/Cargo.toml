[package]
name = "nexusql-android"
version = "0.1.0"
edition = "2021"

[lib]
name = "nexusql_android"
crate-type = ["cdylib"]

[dependencies]
jni = { version = "0.21", default-features = false }
nexusql = { path = "../..", default-features = false }
tokio = { version = "1", features = ["rt", "rt-multi-thread"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
