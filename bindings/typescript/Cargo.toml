[package]
name = "nexusql-node"
version = "2.4.0"
edition = "2021"
license = "MIT"
authors = ["John Nguyen <john@nexusql.io>"]
description = "NexusQL Node.js bindings - AI-native database with vector search"

[lib]
crate-type = ["cdylib"]

[dependencies]
# N-API bindings for Rust ↔ Node.js
napi = { version = "2", default-features = false, features = ["napi8", "async", "tokio_rt"] }
napi-derive = "2"

# NexusQL core (link to parent crate)
nexusql = { path = "../.." }

# Async runtime
tokio = { version = "1", features = ["full"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
strip = true
