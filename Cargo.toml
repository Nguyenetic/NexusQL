[package]
name = "nexusql"
version = "0.1.0"
edition = "2021"
license = "MIT"
authors = ["John Nguyen <john@nexusql.io>"]
repository = "https://github.com/Nguyenetic/NexusQL"
homepage = "https://github.com/Nguyenetic/NexusQL"
documentation = "https://github.com/Nguyenetic/NexusQL#readme"

[dependencies]
tokio = { version = "1", features = ["full"] }
async-trait = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
anyhow = "1"
dashmap = "6"
bytes = "1"
bincode = "1"
sled = "0.34"
ndarray = "0.16"
sqlparser = "0.52"
rand = "0.8"
regex = "1"
ort = "2.0.0-rc.10"
tokenizers = "0.20"
num_cpus = "1.16"
bcrypt = "0.15"
ordered-float = "4.2"

[dev-dependencies]
tokio-test = "0.4"
criterion = { version = "0.5", features = ["html_reports"] }
rusqlite = "0.31"
tempfile = "3"

[[bench]]
name = "quick_bench"
harness = false

[[bench]]
name = "performance_benchmarks"
harness = false

[profile.release]
lto = true
codegen-units = 1
opt-level = 3
